name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  assets:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Package
        env:
          OPENTRANSCRIPT_VERSION: ${{ github.ref_name }}
        run: |
          export OPENTRANSCRIPT_VERSION="${OPENTRANSCRIPT_VERSION#v}"
          ./scripts/package-extension.sh
          ./scripts/package-macos-backend.sh
          cp scripts/install-macos.sh dist/install-macos.sh
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
            dist/install-macos.sh
